name: sabor-mayor

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [sabor-net]

x-business-env: &business-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
  CONFIG_SERVER_URI: http://config-server:8888
  EUREKA_URI: http://discovery-server:8761/eureka
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: ${POSTGRES_USER:-postgres}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  KAFKA_BOOTSTRAP: kafka:9092
  JWT_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
  ZIPKIN_URI: http://zipkin:9411

services:
  # ---------------- Infrastructure ----------------
  postgres:
    image: postgres:16-alpine
    <<: *service-defaults
    # 11 services share this instance; raise the default 100-connection ceiling.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    <<: *service-defaults
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    <<: *service-defaults
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  zipkin:
    image: openzipkin/zipkin:3
    <<: *service-defaults
    ports: ["9411:9411"]

  # ---------------- Platform ----------------
  discovery-server:
    build: ./discovery-server
    <<: *service-defaults
    ports: ["8761:8761"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  config-server:
    build: ./config-server
    <<: *service-defaults
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka
      CONFIG_REPO_PATH: /config-repo
    volumes:
      - ./config-repo:/config-repo:ro
    ports: ["8888:8888"]
    depends_on:
      discovery-server: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  api-gateway:
    build: ./api-gateway
    <<: *service-defaults
    environment:
      <<: *business-env
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    ports: ["8080:8080"]
    depends_on:
      discovery-server: { condition: service_healthy }
      redis: { condition: service_healthy }
      auth-service: { condition: service_started }

  # ---------------- Business services ----------------
  auth-service:
    build: ./auth-service
    <<: *service-defaults
    environment:
      <<: *business-env
      DB_NAME: sabor_auth
      JWT_ISSUER: ${JWT_ISSUER:-https://sabormayor.com}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      JWT_PRIVATE_KEY_PEM: ${JWT_PRIVATE_KEY_PEM:-}
      JWT_PUBLIC_KEY_PEM: ${JWT_PUBLIC_KEY_PEM:-}
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      config-server: { condition: service_healthy }

  user-service:
    build: ./user-service
    <<: *service-defaults
    environment:
      <<: *business-env
      DB_NAME: sabor_user
    ports: ["8082:8082"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      config-server: { condition: service_healthy }

  menu-service:
    build: ./menu-service
    <<: *service-defaults
    environment:
      <<: *business-env
      DB_NAME: sabor_menu
    ports: ["8083:8083"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      config-server: { condition: service_healthy }

  order-service:
    build: ./order-service
    <<: *service-defaults
    environment:
      <<: *business-env
      DB_NAME: sabor_order
    ports: ["8084:8084"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      config-server: { condition: service_healthy }

  reservation-service:
    build: ./reservation-service
    <<: *service-defaults
    environment:
      <<: *business-env
      DB_NAME: sabor_reservation
    ports: ["8085:8085"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      config-server: { condition: service_healthy }

  payment-service:
    build: ./payment-service
    <<: *service-defaults
    environment:
      <<: *business-env
      DB_NAME: sabor_payment
    ports: ["8086:8086"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      config-server: { condition: service_healthy }

  loyalty-service:
    build: ./loyalty-service
    <<: *service-defaults
    environment:
      <<: *business-env
      DB_NAME: sabor_loyalty
    ports: ["8087:8087"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      config-server: { condition: service_healthy }

  notification-service:
    build: ./notification-service
    <<: *service-defaults
    environment:
      <<: *business-env
      DB_NAME: sabor_notification
    ports: ["8088:8088"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      config-server: { condition: service_healthy }

  content-service:
    build: ./content-service
    <<: *service-defaults
    environment:
      <<: *business-env
      DB_NAME: sabor_content
    ports: ["8089:8089"]
    depends_on:
      postgres: { condition: service_healthy }
      config-server: { condition: service_healthy }

  inventory-service:
    build: ./inventory-service
    <<: *service-defaults
    environment:
      <<: *business-env
      DB_NAME: sabor_inventory
    ports: ["8090:8090"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      config-server: { condition: service_healthy }

  analytics-service:
    build: ./analytics-service
    <<: *service-defaults
    environment:
      <<: *business-env
      DB_NAME: sabor_analytics
    ports: ["8091:8091"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      config-server: { condition: service_healthy }

networks:
  sabor-net:
    driver: bridge

volumes:
  postgres-data:
