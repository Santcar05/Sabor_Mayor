<section class="contact" id="contact" aria-labelledby="contact-heading">

  <!-- Full-bleed background -->
  <div class="contact-bg" aria-hidden="true">
    <img src="assets/chef.jpg" alt="" loading="lazy" />
  </div>

  <div class="contact-inner">

    <!-- Dramatic headline -->
    <div class="contact-headline" aria-hidden="true">
      <span class="contact-headline__pre">Reserva tu</span>
      <span class="contact-headline__main" id="contact-heading">Mesa</span>
    </div>

    <!-- Horizontal form -->
    <form
      class="contact-form"
      (ngSubmit)="onSubmit()"
      aria-label="Formulario de reserva"
      novalidate>

      <div class="contact-form__fields">
        <div class="contact-form__field">
          <label class="contact-form__label" for="res-name">Nombre</label>
          <input
            class="contact-form__input"
            type="text"
            id="res-name"
            name="name"
            [(ngModel)]="formData.name"
            autocomplete="given-name"
            placeholder="Tu nombre"
            required
          />
        </div>

        <div class="contact-form__field">
          <label class="contact-form__label" for="res-date">Fecha</label>
          <input
            class="contact-form__input"
            type="date"
            id="res-date"
            name="date"
            [(ngModel)]="formData.date"
            required
          />
        </div>

        <div class="contact-form__field">
          <label class="contact-form__label" for="res-guests">Personas</label>
          <select
            class="contact-form__input contact-form__select"
            id="res-guests"
            name="guests"
            [(ngModel)]="formData.guests"
            required>
            <option value="">—</option>
            @for (n of [1,2,3,4,5,6]; track n) {
              <option [value]="n">{{ n }}</option>
            }
            <option value="7">7+</option>
          </select>
        </div>

        <button class="contact-form__btn" type="submit">
          Reservar
        </button>
      </div>

    </form>

    <!-- Contact info — 3 columns -->
    <div class="contact-info" role="contentinfo" aria-label="Información de contacto">
      <div class="contact-info__item">
        <span class="contact-info__label">Dirección</span>
        <span class="contact-info__value">Calle Gourmet 123<br>Distrito Gastronómico</span>
      </div>
      <div class="contact-info__sep" aria-hidden="true"></div>
      <div class="contact-info__item">
        <span class="contact-info__label">Teléfono</span>
        <a class="contact-info__value contact-info__link" href="tel:+15551234567">+1 (555) 123-4567</a>
      </div>
      <div class="contact-info__sep" aria-hidden="true"></div>
      <div class="contact-info__item">
        <span class="contact-info__label">Horarios</span>
        <span class="contact-info__value">Mar–Dom 18:00–23:00<br>Lun: Cerrado</span>
      </div>
    </div>

  </div>

</section>
