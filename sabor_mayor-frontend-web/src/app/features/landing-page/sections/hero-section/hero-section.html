<section class="hero" aria-label="Sabor Mayor — Alta Gastronomía Latinoamericana">

  <!-- Background full-bleed image -->
  <div class="hero-bg" aria-hidden="true">
    <img src="assets/chef.jpg" alt="" loading="eager" fetchpriority="high" />
  </div>

  <!-- Floating award chip — top right -->
  <div class="hero-badge" aria-hidden="true">
    <span class="hero-badge__year">Est. 1999</span>
    <span class="hero-badge__label">Alta Gastronomía</span>
  </div>

  <!-- Main editorial content — left aligned, vertically centered -->
  <div class="hero-body">
    <div class="hero-content">
      <span class="hero-tagline">Una experiencia única</span>

      <h1 class="hero-title">
        <span class="hero-word">
          <span class="hero-word__inner">Sabor</span>
        </span>
        <span class="hero-word hero-word--accent">
          <span class="hero-word__inner">Mayor</span>
        </span>
      </h1>

      <p class="hero-desc">
        Donde la tradición culinaria latinoamericana<br>
        encuentra la sofisticación contemporánea.
      </p>
    </div>
  </div>

  <!-- CTAs — absolute bottom left -->
  <div class="hero-cta" role="group" aria-label="Acciones principales">
    <button
      class="hero-btn hero-btn--primary"
      appMagneticHover
      [magneticConfig]="{ magneticRange: 160, magneticStrength: 0.5, elasticity: 0.12 }"
      (mouseenter)="onButtonHover()"
      (mouseleave)="onButtonLeave()"
      (click)="onButtonClick()"
      aria-label="Reservar una mesa">
      Reservar Mesa
    </button>
    <a
      href="#featured"
      class="hero-btn hero-btn--ghost"
      aria-label="Ver el menú">
      Ver Menú
    </a>
  </div>

  <!-- Scroll indicator — bottom right -->
  <div class="hero-scroll" aria-hidden="true">
    <span class="hero-scroll__text">Descubrir</span>
    <div class="hero-scroll__line"></div>
  </div>

</section>
